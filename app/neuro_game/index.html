<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>神经视界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
/* layout: full-bleed 3D village at dusk; HUD pinned to corners; dialogue as a bottom sheet. Data elements use the viridis activation scale; the village itself is warm pastel. */
:root{
  color-scheme:dark;
  --ink:#141a45;
  --panel:rgba(20,22,58,.86);
  --line:rgba(200,190,255,.28);
  --text:#f1efff;
  --muted:#b3add8;
  --hot:#fde725;
  --mid:#21918c;
  --rose:#ff9bb0;
  --display:"Unbounded","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}

.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
#top{top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#brand{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;max-width:236px;backdrop-filter:blur(6px);text-align:left}
#brand h1{font-family:var(--display);font-size:15px;letter-spacing:.06em;margin:0 0 4px;color:var(--hot);font-weight:600}
#prog{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#tasks{list-style:none;margin:8px 0 0;padding:0;display:none;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
#brand.open #tasks{display:flex}
#tasks li{display:flex;gap:6px;align-items:center}
#tasks li::before{content:"";width:9px;height:9px;border:1.5px solid var(--muted);border-radius:2px;flex:none}
#tasks li.done{color:var(--text)}
#tasks li.done::before{background:var(--hot);border-color:var(--hot)}
#right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#map{width:96px;height:96px;border-radius:50%;border:2px solid var(--line);background:#234;display:block}
#helpBtn{width:40px;height:40px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-family:var(--mono);font-weight:600;font-size:17px}

#stick{position:fixed;left:18px;bottom:22px;width:118px;height:118px;border-radius:50%;z-index:6;
  background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1.5px solid var(--line);touch-action:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
  background:rgba(253,231,37,.88);box-shadow:0 0 18px rgba(253,231,37,.45)}
body.touch #stick{display:block}

#bar{right:16px;bottom:22px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#row{display:flex;gap:10px;align-items:center}
#jump{width:54px;height:54px;border-radius:50%;background:var(--panel);border:1.5px solid var(--hot);color:var(--hot);font-weight:600;font-size:16px}
#jump:active{background:var(--hot);color:#1a1630}
#mode{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
#mode button{min-width:64px;height:40px;border-radius:999px;font-size:14px;color:var(--muted)}
#mode button[aria-pressed="true"]{background:var(--hot);color:#1a1630;font-weight:600}
#palette{display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;gap:8px;align-items:center}
body.build #palette{display:flex}
body.touch #palette{flex-direction:column}
.sw{width:34px;height:34px;border-radius:8px;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:#fff;transform:scale(1.08)}
#erase{height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
#erase[aria-pressed="true"]{background:#e2557a;border-color:#e2557a;color:#fff}

#talk{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);z-index:6;display:none;
  background:var(--hot);color:#1a1630;font-weight:600;font-size:15px;height:46px;padding:0 20px;border-radius:999px;
  box-shadow:0 4px 24px rgba(253,231,37,.35);white-space:nowrap}
#toast{position:fixed;left:50%;top:128px;transform:translateX(-50%);z-index:7;background:var(--panel);border:1px solid var(--line);
  padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1}

.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:min(580px,calc(100vw - 32px));z-index:8;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;backdrop-filter:blur(10px);display:none}
.sheet.on{display:block}
#dlgHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#dlgName{font-family:var(--display);font-size:13px;color:var(--hot);letter-spacing:.05em}
#dlgClose{width:36px;height:36px;border-radius:50%;color:var(--muted);font-size:18px}
#dlgText{font-size:15px;line-height:1.7;margin:0 0 12px;text-wrap:pretty;-webkit-user-select:text;user-select:text;max-height:34vh;overflow-y:auto}
#dlgChoices{display:flex;flex-direction:column;gap:7px;max-height:34vh;overflow-y:auto}
#dlgChoices button{text-align:left;padding:9px 12px;min-height:42px;border-radius:10px;border:1px solid var(--line);font-size:14px;background:rgba(255,255,255,.06);flex:none}
#dlgChoices button.seen{color:var(--muted)}
#dlgChoices button:active{background:rgba(253,231,37,.18)}
#intro h2{font-family:var(--display);font-size:18px;margin:0 0 8px;color:var(--hot);font-weight:600;text-wrap:balance}
#intro p{font-size:14px;line-height:1.65;margin:0 0 8px;color:var(--text)}
#intro .keys{font-family:var(--mono);font-size:12px;color:var(--muted)}
#go{margin-top:6px;width:100%;height:46px;border-radius:12px;background:var(--hot);color:#1a1630;font-weight:600;font-size:15px}
body.talking #bar,body.talking #stick,body.talking #talk{display:none!important}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:20;background:var(--ink)}
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="3D 村庄视图"></canvas>

<div class="hud" id="top">
  <button id="brand" aria-label="任务清单">
    <h1>神经视界</h1>
    <div id="prog"></div>
    <ul id="tasks">
      <li data-t="input">开关一个输入神经元</li>
      <li data-t="kernel">换一个卷积核</li>
      <li data-t="stride">改一次步幅或填充</li>
      <li data-t="rcnn">切换 R-CNN 的代际</li>
      <li data-t="thr">拨一次置信度阈值</li>
      <li data-t="track">关掉运动预测看 ID 切换</li>
      <li data-t="vlm">给 VLM 换一张图</li>
      <li data-t="tower">搭一座被认出的“塔”</li>
    </ul>
  </button>
  <div id="right">
    <canvas id="map" width="192" height="192" aria-label="小地图"></canvas>
    <button id="helpBtn" aria-label="操作说明">?</button>
  </div>
</div>

<div id="stick" aria-hidden="true"><div id="knob"></div></div>

<div class="hud" id="bar">
  <div id="palette">
    <button class="sw" data-c="0" aria-label="紫色方块"></button>
    <button class="sw" data-c="1" aria-label="蓝色方块"></button>
    <button class="sw" data-c="2" aria-label="青色方块"></button>
    <button class="sw" data-c="3" aria-label="绿色方块"></button>
    <button class="sw" data-c="4" aria-label="黄色方块"></button>
    <button id="erase" aria-pressed="false">拆除</button>
  </div>
  <div id="row">
    <button id="jump" aria-label="跳跃">跳</button>
    <div id="mode" role="group" aria-label="模式">
      <button id="mExplore" aria-pressed="true">探索</button>
      <button id="mBuild" aria-pressed="false">搭建</button>
    </div>
  </div>
</div>

<button id="talk"></button>
<div id="toast" role="status"></div>

<div class="sheet" id="dlg" role="dialog" aria-labelledby="dlgName">
  <div id="dlgHead"><span id="dlgName"></span><button id="dlgClose" aria-label="结束对话">✕</button></div>
  <p id="dlgText"></p>
  <div id="dlgChoices"></div>
</div>

<div class="sheet" id="intro" role="dialog" aria-labelledby="introT">
  <h2 id="introT">欢迎来到神经视界村</h2>
  <p>村里住着八位居民,各管一门手艺:神经网络、CNN、R-CNN、YOLO、阈值、运动追踪、VLM,还有一块可以自己搭方块的工地。每个展区都是真的在算,点一点就能改。村口两间挂着“请进”牌子的小屋可以走进去。</p>
  <p class="keys" id="introKeys"></p>
  <button id="go">进村</button>
</div>

<div id="err"><p>这个设备没能启动 WebGL,3D 世界无法显示。换一个浏览器或设备再试一次。</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var hot = window.claude && window.claude.hot;

function start(saved){
saved = (saved && saved.v===2) ? saved : {};
var $ = function(id){ return document.getElementById(id); };
if(!window.THREE){ $('err').style.display='flex'; return; }

var FONT='"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif';
var isTouch = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window);
if(isTouch) document.body.classList.add('touch');
var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var PI=Math.PI;

/* ---------- persistence ---------- */
var store = null;
try{ store = JSON.parse(localStorage.getItem('nv-world-v2') || 'null'); }catch(e){}
if(saved.blocks) store = saved;

/* ---------- renderer ---------- */
var canvas = $('view'), renderer;
try{ renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true}); }
catch(e){ $('err').style.display='flex'; return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x8f6fa6);
scene.fog = new THREE.Fog(0x8f6fa6, 48, 175);
var camera = new THREE.PerspectiveCamera(70, 1, 0.1, 800);
camera.rotation.order = 'YXZ';
function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.fov = w < h ? 80 : 66; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

/* ---------- colour scale (viridis) ---------- */
var VIR=[[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]];
function vir(t){ t=Math.max(0,Math.min(1,t)); var f=t*4,i=Math.min(3,Math.floor(f)),u=f-i,a=VIR[i],b=VIR[i+1];
  return [a[0]+(b[0]-a[0])*u, a[1]+(b[1]-a[1])*u, a[2]+(b[2]-a[2])*u]; }
function virCss(t){ var c=vir(t); return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')'; }
function virSet(col,t,k){ var c=vir(t); k=(k===undefined?1:k)/255; return col.setRGB(c[0]*k,c[1]*k,c[2]*k); }
function hexCss(h){ return '#'+('000000'+h.toString(16)).slice(-6); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function mkRng(s){ return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
var rand=mkRng(20261112);

/* ---------- canvas / label helpers ---------- */
function canvasTex(c){ var t=new THREE.CanvasTexture(c); t.generateMipmaps=false; t.minFilter=THREE.LinearFilter; return t; }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function makeLabel(text,opt){
  opt=opt||{};
  var c=document.createElement('canvas'), ctx=c.getContext('2d'), tex=canvasTex(c);
  var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false,fog:false}));
  var h=opt.h||0.5, last=null;
  sp.setText=function(t){
    if(t===last) return; last=t;
    var fs=44,pad=16,font='600 '+fs+'px '+FONT;
    ctx.font=font;
    var w=Math.ceil(ctx.measureText(t).width)+pad*2;
    c.width=w; c.height=fs+pad*2;
    ctx.font=font; ctx.textBaseline='middle';
    rr(ctx,2,2,w-4,c.height-4,16);
    ctx.fillStyle=opt.bg||'rgba(20,22,58,.80)'; ctx.fill();
    ctx.lineWidth=3; ctx.strokeStyle=opt.border||'rgba(200,190,255,.4)'; ctx.stroke();
    ctx.fillStyle=opt.color||'#f1efff'; ctx.fillText(t,pad,c.height/2+2);
    tex.needsUpdate=true;
    sp.scale.set(h*w/c.height,h,1);
  };
  sp.setText(text);
  return sp;
}
function label(text,x,y,z,opt){ var s=makeLabel(text,opt); s.position.set(x,y,z); scene.add(s); return s; }
var HOT={color:'#fde725',border:'rgba(253,231,37,.55)'};
var glowTex=(function(){ var c=document.createElement('canvas'); c.width=c.height=64; var x=c.getContext('2d');
  var g=x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,255,255,.45)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64); return canvasTex(c); })();
function glow(color,size,opacity){ var s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:color,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:opacity===undefined?.6:opacity}));
  s.scale.set(size,size,1); return s; }

/* ---------- geometry + material kit ---------- */
var G={ sph:new THREE.SphereGeometry(1,18,12), lo:new THREE.SphereGeometry(1,10,7), box:new THREE.BoxGeometry(1,1,1),
  cyl:new THREE.CylinderGeometry(1,1,1,12), cone:new THREE.ConeGeometry(1,1,12), taper:new THREE.CylinderGeometry(.65,1,1,14),
  pyr:new THREE.ConeGeometry(1,1,4), torus:new THREE.TorusGeometry(1,.2,6,18), disc:new THREE.CircleGeometry(1,22) };
G.disc.rotateX(-PI/2); G.pyr.rotateY(PI/4);
var unitBox=G.box, mc={};
function T(hex,em){ var k='t'+hex+'_'+(em||0); return mc[k]||(mc[k]=new THREE.MeshToonMaterial(em?{color:hex,emissive:hex,emissiveIntensity:em}:{color:hex})); }
function B(hex,op){ var k='b'+hex+'_'+(op||0); return mc[k]||(mc[k]=new THREE.MeshBasicMaterial(op?{color:hex,transparent:true,opacity:op,depthWrite:false}:{color:hex})); }
var shadowM=new THREE.MeshBasicMaterial({color:0x1a1035,transparent:true,opacity:.26,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});
var WOOD=0x8a6044, WOOD2=0xcdb38a, STONE=0xa59fb5, CREAM=0xf6e7cf, DARK=0x2a2440;
function add(p,geo,m,sx,sy,sz,x,y,z){ var o=new THREE.Mesh(geo,m); o.scale.set(sx,sy,sz); o.position.set(x||0,y||0,z||0); if(p) p.add(o); return o; }
function ball(p,m,rx,ry,rz,x,y,z){ return add(p,G.sph,m,rx,ry,rz,x,y,z); }
function lo(p,m,rx,ry,rz,x,y,z){ return add(p,G.lo,m,rx,ry,rz,x,y,z); }
function bx(p,m,sx,sy,sz,x,y,z){ return add(p,G.box,m,sx,sy,sz,x,y,z); }
function cy(p,m,r,h,x,y,z){ return add(p,G.cyl,m,r,h,r,x,y,z); }
function cn(p,m,r,h,x,y,z){ return add(p,G.cone,m,r,h,r,x,y,z); }
function disc(p,m,r,x,y,z){ return add(p,G.disc,m,r,1,r,x,y,z); }
function shadow(p,r,x,z){ return disc(p,shadowM,r,x||0,.04,z||0); }
function grp(p,x,y,z,ry){ var g=new THREE.Group(); g.position.set(x||0,y||0,z||0); if(ry) g.rotation.y=ry; if(p) p.add(g); return g; }
function gable(w,h,d){ var s=new THREE.Shape(); s.moveTo(-w/2,0); s.lineTo(w/2,0); s.lineTo(0,h); s.lineTo(-w/2,0);
  var g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false}); g.translate(0,0,-d/2); return g; }
function edgeBox(w,h,d,color,t,p){
  t=t||0.06; var g=new THREE.Group(), m=B(color);
  [-1,1].forEach(function(a){ [-1,1].forEach(function(b){
    bx(g,m,w+t,t,t,0,a*h/2,b*d/2); bx(g,m,t,h+t,t,a*w/2,0,b*d/2); bx(g,m,t,t,d+t,a*w/2,b*h/2,0);
  });});
  if(p) p.add(g); return g;
}
/* merge every mesh under a group into one mesh per material (static things only) */
function bake(group){
  group.updateMatrixWorld(true);
  var inv=new THREE.Matrix4().copy(group.matrixWorld).invert(), by=new Map(), rel=new THREE.Matrix4();
  group.traverse(function(o){ if(!o.isMesh) return;
    var g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();
    rel.multiplyMatrices(inv,o.matrixWorld); g.applyMatrix4(rel);
    var a=by.get(o.material); if(!a){ a=[]; by.set(o.material,a); } a.push(g); });
  while(group.children.length) group.remove(group.children[0]);
  by.forEach(function(list,material){ var n=0; list.forEach(function(g){ n+=g.attributes.position.count; });
    var pos=new Float32Array(n*3), nor=new Float32Array(n*3), off=0;
    list.forEach(function(g){ pos.set(g.attributes.position.array,off*3); nor.set(g.attributes.normal.array,off*3); off+=g.attributes.position.count; g.dispose(); });
    var bg=new THREE.BufferGeometry(); bg.setAttribute('position',new THREE.BufferAttribute(pos,3)); bg.setAttribute('normal',new THREE.BufferAttribute(nor,3));
    var m=new THREE.Mesh(bg,material); m.frustumCulled=group.userData.cull!==false; group.add(m); });
  return group;
}
var dummy=new THREE.Object3D(), tmpCol=new THREE.Color();
function Inst(geo,material,max){ this.m=new THREE.InstancedMesh(geo,material,max); this.m.frustumCulled=false; this.n=0; this.max=max; scene.add(this.m); }
Inst.prototype.add=function(x,y,z,sx,sy,sz,ry,color){ if(this.n>=this.max) return;
  dummy.position.set(x,y,z); dummy.scale.set(sx,sy,sz); dummy.rotation.set(0,ry||0,0); dummy.updateMatrix();
  this.m.setMatrixAt(this.n,dummy.matrix); if(color!==undefined) this.m.setColorAt(this.n,tmpCol.setHex(color)); this.n++; };
Inst.prototype.done=function(){ this.m.count=this.n; this.m.instanceMatrix.needsUpdate=true; if(this.m.instanceColor) this.m.instanceColor.needsUpdate=true; };

var ST=new THREE.Group(); ST.userData.cull=false;      /* all static scenery, baked at the end */
var invisible=new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false});
var interactables=[], obstacles=[], rects=[], ticks=[];
function onTick(fn){ ticks.push(fn); }
function hitSphere(p,r,x,y,z,fn){ var h=new THREE.Mesh(G.lo,invisible); h.scale.set(r,r,r); h.position.set(x,y,z); h.userData.tap=fn; p.add(h); interactables.push(h); return h; }
var toastT=0;
function toast(msg){ var el=$('toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove('on'); },2600); }

/* ---------- tasks + knowledge counter ---------- */
var TASK_KEYS=['input','kernel','stride','rcnn','thr','track','vlm','tower'];
var tasks=(store&&store.tasks)||{}, seen=(store&&store.seen)||{}, totalNodes=0;
function renderTasks(){
  var d=0; Array.prototype.forEach.call(document.querySelectorAll('#tasks li'),function(li){ var ok=!!tasks[li.dataset.t]; if(ok) d++; li.classList.toggle('done',ok); });
  $('prog').textContent='任务 '+d+'/'+TASK_KEYS.length+' · 知识点 '+Object.keys(seen).length+'/'+totalNodes;
}
function doneTask(k){ if(tasks[k]) return; tasks[k]=true; renderTasks(); save();
  var all=TASK_KEYS.every(function(t){ return tasks[t]; });
  toast(all ? '八个任务全部完成,你已经是村里的老手了。' : '任务完成 ✓'); }
$('brand').onclick=function(){ this.classList.toggle('open'); };
var save=function(){};

/* ---------- player (declared early; exhibits read the position) ---------- */

  for(var l=0;l<3;l++){ var z=[];
    for(var j=0;j<SIZES[l+1];j++){ var s=Bs[l][j]; for(var i=0;i<a.length;i++) s+=Wt[l][j][i]*a[i]; z.push(s); }

  vanish:{t:'反向传播时梯度要一层层连乘。sigmoid 和 tanh 在两端很平,导数接近 0,乘上十几层就几乎没了,前面的层学不动,这叫梯度消失。ReLU 在正半轴导数恒为 1,再加上残差连接和归一化层,几十上百层的网络才训练得起来。残差连接可以去问卷卷。'},
  softmax:{t:'输出层先算出三个原始分数(logits),softmax 把它们取指数再除以总和,变成加起来等于 1 的三个概率。注意它只是归一化后的分数,不等于真实把握:网络可以很自信地答错。这一点到了闸闸那里会变得很重要。'},
  learn:{t:'靠三样东西。损失函数量出“错了多少”,这里用交叉熵;反向传播用链式法则算出每个权重对损失的影响,也就是梯度;梯度下降让每个权重朝着让损失变小的方向挪一小步。重复上千次,权重就成形了。',c:[['重新训练一次给我看','retrain',function(){ retrain(); }],['每一步挪多大?','lr']]},
  retrain:{t:'权重已经打乱,正在重新训练。抬头看牌子上的 loss 往下掉,连线的颜色和粗细会慢慢稳定。每次初始值不同,训练出来的权重也不同,但对同样的输入给出的答案相近:能解决同一个问题的权重有很多组。'},
  lr:{t:'步子大小叫学习率。太大,会在谷底两边来回跳,甚至越跳越高;太小,要走很久,还容易停在不好的地方。实际训练常用先大后小的学习率调度,以及 Adam 这类会给每个权重自动调步长的优化器。这里用的是最朴素的随机梯度下降,学习率 0.12。'},
  overfit:{t:'这个小网络只见过 8 种输入组合,把它们背下来就行。真实任务里,网络如果把训练集背得太熟,连噪声也记住,遇到新数据反而变差,这叫过拟合。对策是留出验证集盯着、做数据增强、加权重衰减和 dropout,或者干脆找更多数据。'},
  guide:{t:'建议的路线:先去西边找卷卷,看 CNN 怎么“看”图;再往北,西北角的熊师傅讲 R-CNN,正北的悠洛讲 YOLO,田另一头的闸闸管阈值;东北牧场的追追讲运动追踪;最后去西南的天文台找薇拉聊 VLM。东边工地的框框那儿可以自己搭方块。右上角有小地图。'}
 },
 kern:{
  start:{t:'我是卷卷,脑袋就是一个 3×3 的卷积核。CNN 的全部本事,就是让我这样的小方块在图上一格一格滑过去找图案。墙上的板子是我的工作现场,都可以点。',
    c:[['卷积到底怎么算?','how'],['为什么能找到边缘?','edge'],['步幅和填充是什么?','stride'],['“通道”是什么?','chan'],['为什么比全连接省?','share'],['感受野是什么?','rf'],['池化是干嘛的?','pool'],['深层学到了什么?','hier'],['ResNet 的残差连接','res'],['CNN 是怎么发展来的?','hist']]},
  how:{t:'黄框盖住输入图的 9 个像素,每个像素乘上我对应位置的数,9 个乘积加起来,就是特征图上的一格。然后黄框右移,再算一次。严格说这叫互相关,不过深度学习里大家都管它叫卷积。'},
  edge:{t:'看 Sobel-X:左列是负数,右列是正数。盖住的区域如果左右一样亮,正负抵消得 0;左暗右亮,结果就很大。所以它只在竖直边缘处发亮。换成 Sobel-Y 就只认水平边缘。点卷积核那块小板子可以换着看。',c:[['帮我换一个卷积核','edge',function(){ nextKernel(); }]]},
  stride:{t:'两个旋钮。步幅 S 是我每次挪几格:S=2 时输出边长大约减半,相当于顺手做了下采样。填充 P 是在图四周补几圈 0:P=1 时 3×3 的核能把边缘像素也放到正中间,输出和输入一样大。公式是 输出 = (输入 + 2P − 核宽) / S + 1,向下取整。卷积核板子下面有两个按钮,点了以后特征图标题里的算式会跟着变。'},
  chan:{t:'彩色图有红绿蓝 3 个通道,所以真实的 3×3 卷积核其实是 3×3×3 的小立方体,一次看三层。一层卷积通常有几十上百个不同的核,每个核产出一张特征图,叠起来就是下一层的“通道”。所以越往深处,图越来越小,通道越来越多。'},
  share:{t:'全连接层里,每个输出要和每个输入单独连一根线:一张 224×224 的彩色图接 1000 个神经元,就是约 1.5 亿个权重。而我只有 9 个数,整张图共用。这叫权重共享,理由很朴素:猫耳朵出现在左上角还是右下角,检测它的方法应该一样。'},
  rf:{t:'感受野是输出上的一格“看得到”输入上多大一块。一层 3×3 看 3×3;叠两层,第二层的一格看到 5×5;叠三层是 7×7。所以 VGG 全用 3×3 小核叠深,既能看得远,参数又比一个 7×7 大核少,中间还多了几次非线性。'},
  pool:{t:'最大池化把特征图每 2×2 格里最大的那个留下,边长减半。图小了,后面算得快;图案挪动一两个像素,结果基本不变。不过现在很多网络改用步幅 2 的卷积来缩小,让网络自己学怎么下采样。',c:[['换一张输入图看看','pool',function(){ nextImage(); }]]},
  hier:{t:'浅层的核学到的东西和 Sobel 很像:边缘、色块、条纹。中层把它们组合成纹理和角点,深层再组合成眼睛、轮子、文字这样的部件。没人教它们这样分工,这是训练自己长出来的层次结构。'},
  res:{t:'网络加深到几十层后,人们发现训练误差反而变高。不是过拟合,是优化不动了。ResNet(2015)的办法是加一条近路:每个模块的输出 = F(x) + x。模块只需要学“在原样的基础上改一点”,梯度也能沿着近路直接流回前面的层。靠这个,152 层的网络成功训练了出来。'},
  hist:{t:'1998 年 LeNet 用卷积识别手写数字。2012 年 AlexNet 在 ImageNet 上大幅领先,靠的是 GPU、ReLU 和 dropout,深度学习从此起飞。2014 年 VGG 证明了小核叠深有用,2015 年 ResNet 解决了深层难训练的问题。后来这些分类网络被拆下来当“骨干”,给检测器提供特征,熊师傅和悠洛用的都是它。'}
 },
 bear:{
  start:{t:'我是熊师傅,做两阶段检测的手艺人。分类只回答“这是什么”,检测还得回答“在哪儿”。我们这派的思路很直接:先猜哪些地方可能有东西,再一个一个仔细看。板子上放着三代做法,点一下换一代。',
    c:[['第一代 R-CNN 怎么做?','rcnn'],['候选框是哪来的?','ss'],['Fast R-CNN 快在哪?','fast'],['RoI 池化是什么?','roi'],['Faster R-CNN 和 RPN','faster'],['锚框是什么?','anchor'],['框是怎么修准的?','reg'],['还能分割出轮廓吗?','mask'],['和 YOLO 比谁好?','vs'],['换下一代给我看','start',function(){ rcNext(); }]]},
  rcnn:{t:'2014 年的 R-CNN 分四步:用选择性搜索挑出约 2000 个候选框;把每个框里的图抠出来,拉伸到固定大小;逐个送进 CNN 提特征;再用 SVM 分类,并回归修正框的位置。问题很明显:一张图要跑约 2000 次 CNN,用 VGG16 在 GPU 上也要约 47 秒。'},
  ss:{t:'选择性搜索是个不需要学习的传统算法:先把图切成很多颜色纹理相近的小块,再自底向上把相似的相邻小块不断合并,合并过程中出现过的区域都当作候选框。它在 CPU 上处理一张图要大约 2 秒,后来成了整个流程里最慢的一环。'},
  fast:{t:'2015 年的 Fast R-CNN 发现那 2000 个框大量重叠,重复算卷积太浪费。于是整张图只过一次 CNN,得到一张特征图,再把每个候选框投影到特征图上,取对应的那一块。分类和框回归也合进同一个网络一起训练。检测部分降到约 0.3 秒,瓶颈变成了选择性搜索。'},
  roi:{t:'候选框大小不一,但后面的全连接层要固定尺寸的输入。RoI 池化把特征图上的每个候选区域均匀切成 7×7 个格子,每格取最大值,于是不管框多大都变成 7×7。后来 Mask R-CNN 改成 RoIAlign,用双线性插值取值,不再把坐标取整,位置更准。'},
  faster:{t:'同样在 2015 年,Faster R-CNN 把候选框也交给网络:在特征图上滑一个小卷积网络,叫区域候选网络 RPN,每个位置判断“这里有没有物体”并粗略给出框。它和检测头共用同一张特征图,几乎不多花时间。整套下来约 0.2 秒一张,第一次接近实时。'},
  anchor:{t:'RPN 不是凭空画框。特征图的每个位置预先放 9 个参考框(3 种大小 × 3 种长宽比),叫锚框。网络对每个锚框只需要回答两件事:里面有物体吗?要怎么挪动、缩放才能套准?把“从零画框”变成“微调现成的框”,学起来容易得多。'},
  reg:{t:'框回归预测的是 4 个偏移量:中心在 x、y 方向挪多少(按框宽高的比例),宽和高各缩放多少(取对数)。用相对量而不是绝对像素,大物体和小物体才能用同一套参数。板子上最后的粗框比任何一个候选框都贴得更紧,就是回归修出来的。'},
  mask:{t:'能。2017 年的 Mask R-CNN 在 Faster R-CNN 上多加了一个小分支,对每个框再输出一张像素级的掩码,同时完成检测和实例分割。同样的套路还能加关键点分支做人体姿态。两阶段框架的好处就在这儿:拿到了准的区域,想加什么任务就加一个头。'},
  vs:{t:'各有所长。我们两阶段先筛后看,对小物体和要求框很准的场合更稳,但慢。悠洛那派一步到位,快得多,适合视频和嵌入式设备。这些年两边互相借鉴,差距已经很小了。往东走到田边,让悠洛自己说。'}
 },
 yolo:{
  start:{t:'我是悠洛!You Only Look Once,只看一次。熊师傅先找候选再逐个看,我嫌慢:把整张图一次送进网络,所有框一口气全出来。眼前这块田就是我的网格,地上每闪一下就是一次前向。',
    c:[['网格是怎么分工的?','grid'],['每个格子输出什么?','out'],['置信度怎么定义?','conf'],['为什么这么快?','fast'],['你有什么弱点?','weak'],['后来的版本改了什么?','evo'],['损失函数长什么样?','loss'],['背景太多怎么办?','imb'],['还有别的路线吗?','detr'],['这么多框怎么收拾?','many']]},
  grid:{t:'把图切成 S×S 个格子,原版是 7×7,这块田是 6×6。规则只有一条:物体的中心点落在哪一格,就由哪一格负责预测它。地上淡黄色的格子就是有物体中心落进去的“责任格”。'},
  out:{t:'原版每个格子预测 2 个框,每个框 5 个数:中心 x、y,宽、高,加一个置信度;另外每格再给出 20 个类别的概率。所以整个网络的输出是一个 7×7×30 的张量,检测被变成了一道回归题。'},
  conf:{t:'置信度 = 这个框里有物体的概率 × 预测框和真实框的 IoU。也就是说它同时表达“有没有”和“框得准不准”。再乘上类别概率,就得到每个框对每个类别的最终分数。田里框上的小数就是这个分数。'},
  fast:{t:'因为只有一次前向,没有候选框,也没有逐框处理。原版论文报告在当时的 Titan X 显卡上达到每秒 45 帧,小号版本超过 150 帧。而且我看的是整张图,有上下文,比只看局部的 Fast R-CNN 更少把背景误认成物体。'},
  weak:{t:'第一版毛病不少。每个格子只能报 2 个框、1 个类别,所以一群挤在一起的小鸟我就数不清。框的位置是直接回归的,不如两阶段精细。田里那个小南瓜最高分只有 0.42,就是我对小目标没把握的例子。'},
  evo:{t:'后来的版本一路补课:借用锚框,让预测变成微调;在三个不同分辨率的特征图上同时预测,大中小物体各管一层;换更强的骨干和数据增强。再往后又去掉锚框,直接预测中心点和到四边的距离;还有版本在训练时就让每个物体只对应一个框,连 NMS 都省了。'},
  loss:{t:'损失是三部分加起来:框的位置和大小误差、置信度误差、类别误差。有两个细节:只有“负责”这个物体的那个框才算位置误差;没有物体的格子占大多数,它们的置信度误差要乘一个小权重,不然网络会学成“到处都说没有”。'},
  imb:{t:'一张图里绝大多数位置都是背景,这是一阶段检测器的通病:简单的负样本太多,把损失淹没了。2017 年的 RetinaNet 提出 Focal Loss,自动压低容易样本的权重,让训练聚焦在难例上,一阶段的精度由此追上了两阶段。'},
  detr:{t:'有。2020 年的 DETR 用 Transformer 直接输出一组固定数量的预测,训练时用匈牙利算法把预测和真实目标一一配对。因为每个目标只配一个预测,不需要锚框,也不需要 NMS。追追做追踪关联时用的也是匈牙利算法。'},
  many:{t:'一次吐出几十上百个框,大部分是低分的噪声和重复。所以后面必须接两道工序:按置信度阈值筛一遍,再用 NMS 去重。那是闸闸的活儿,他就在田的另一头。'}
 },
 frog:{
  start:{t:'呱。我是闸闸,管两道闸。检测器吐出来的不是答案,是一堆带分数的候选框。第一道闸按置信度筛,第二道闸 NMS 去重。路两边的牌子都能点,拨一拨,看北边大板上的数字怎么变。',
    c:[['置信度阈值是什么?','conf'],['精确率和召回率','pr'],['阈值该定多少?','pick'],['NMS 是怎么做的?','nms'],['NMS 自己的阈值','nmst'],['IoU 是什么?','iou'],['mAP 是怎么算的?','map'],['那个小南瓜怎么回事?','small'],['帮我拨一档阈值','start',function(){ tgT.plane.userData.tap(); }],['帮我开 / 关 NMS','start',function(){ tgN.plane.userData.tap(); }]]},
  conf:{t:'规则只有一句:分数低于阈值的框扔掉。板上的白色虚线框就是被这道闸拦下的。阈值 0.1 几乎全放行,0.9 只留最有把握的。没有哪个值天生正确,它是你在“宁可错报”和“宁可漏报”之间选的位置。'},
  pr:{t:'精确率 = 报出来的框里有多少是对的;召回率 = 真实的目标里有多少被找到了。阈值往上拨,误报减少,精确率升,但没把握的真目标也被拦掉,召回率降。往下拨正相反。拨一圈就能看到两个数此消彼长。'},
  pick:{t:'看哪种错的代价大。医学筛查漏掉病灶很危险,阈值要低,先保召回,再由医生复核。自动给相册打标签,错标很烦人,阈值可以高。如果想要一个折中的数,常用 F1,也就是精确率和召回率的调和平均,挑让 F1 最大的那个阈值。'},
  nms:{t:'非极大值抑制。把过了第一道闸的框按分数从高到低排队;取出最高分的留下,然后把所有和它同类、且 IoU 超过 0.5 的框删掉;在剩下的里面再取最高分,重复到队伍空。板上的红色虚线框就是这样被压掉的。把 NMS 关掉看看,同一个南瓜上会叠好几个框,精确率跟着掉。'},
  nmst:{t:'NMS 自己也有个阈值。定得低,稍有重叠就删,两个紧挨着的真目标会被误删一个,人群里尤其常见;定得高,重复框删不干净。Soft-NMS 的办法是不直接删,而是按重叠程度把分数打折,给挨得近的真目标留条活路。'},
  iou:{t:'交并比:两个框重叠部分的面积,除以它们合起来占的面积。完全重合是 1,不沾边是 0。它在检测里出现三次:训练时判断哪个预测负责哪个目标,NMS 里判断是不是重复,评测时判断算不算检测对了,通常 IoU 达到 0.5 才算对。'},
  map:{t:'单看一个阈值不公平,所以把阈值从高到低扫一遍,把每个点的精确率和召回率画成一条曲线,曲线下的面积叫 AP。对所有类别取平均就是 mAP。COCO 榜单更严,还要在 IoU 从 0.5 到 0.95 的十个门槛上再平均一次。'},
  small:{t:'东北角那个小南瓜,最高分的框只有 0.42。阈值在 0.5 时它被拦下,召回率只有 80%。拨到 0.25 它回来了,召回率到 100%,但同时放进来几个误报,精确率掉下去。这就是阈值两难的缩影。追追那边有个聪明办法能利用这种低分框,去问问他 ByteTrack。'}
 },
 dog:{
  start:{t:'汪!我是追追,牧场的牧羊犬。检测器每一帧都是从头认一遍,它不知道这一帧的羊和上一帧的羊是同一只。我的活儿是给每只动物一个不变的编号,这叫多目标追踪。北边大板上是我眼里的俯视图。',
    c:[['追踪的基本流程','tbd'],['卡尔曼滤波是什么?','kal'],['检测和轨迹怎么配对?','assoc'],['被挡住了怎么办?','occ'],['什么是 ID 切换?','idsw'],['SORT 和 DeepSORT','sort'],['ByteTrack 聪明在哪?','byte'],['追踪用什么指标?','metric'],['光流又是什么?','flow']]},
  tbd:{t:'主流做法叫“先检测后追踪”,每帧四步:检测器给出这一帧的框;每条已有轨迹预测自己这一帧该在哪;把预测和检测配对;配上的用检测更新轨迹,没配上的检测开一条新轨迹,太久没配上的轨迹删掉。板上的 × 是检测,方框是轨迹,拖着的线是它走过的路。'},
  kal:{t:'卡尔曼滤波给每条轨迹维护一个状态:位置和速度,以及对它们有多不确定。每帧先“预测”:按速度往前推一步,不确定度变大。再“更新”:拿配上的检测来修正,检测越可信就越往检测那边靠。老实说,板上用的是它的简化版,恒速模型加固定增益,思路一样。'},
  assoc:{t:'把每条轨迹和每个检测两两算一个代价,比如预测框和检测框的 IoU,或者中心距离,得到一张代价表。匈牙利算法能在这张表上找出总代价最小的一对一配对。离得太远的配对直接禁止,这叫门控。板上为了简单用的是贪心:从最近的一对开始配。'},
  occ:{t:'羊走进棚子,检测器就看不见了。这时轨迹没有检测可配,只能靠预测“盲走”,板上显示成虚线框。只要在删除期限内羊从另一头出来,而且离预测位置不远,就能重新接上,ID 不变。把“运动预测”关掉再看:框停在棚口等,羊从另一头出来时离得太远接不上,只好发一个新 ID。',c:[['帮我开 / 关运动预测','occ',function(){ tgK.plane.userData.tap(); }]]},
  idsw:{t:'同一只动物的编号中途变了,或者两只动物交换了编号,都算一次 ID 切换。它是追踪里最伤的错误:数羊会数多,算停留时间会算错。板子底下的计数是拿真实身份对出来的。两只动物迎面交错、或者从遮挡里出来,是最容易出错的时刻。'},
  sort:{t:'SORT(2016)就是卡尔曼滤波加匈牙利算法,用 IoU 当代价,简单到每秒能跑几百帧,但遮挡一久就换 ID。DeepSORT 加了一个外观网络(ReID),给每个框提取一段“长相”特征向量,配对时既看位置也看长得像不像,所以被挡住几秒再出来还能认回来。'},
  byte:{t:'通常检测器会用阈值把低分框扔掉。ByteTrack(2021)发现被遮挡一半的目标恰恰分数低,扔掉就断轨了。它分两轮配对:先用高分框配轨迹,剩下没配上的轨迹再去低分框里找。低分框里的真目标被捞回来,背景误报因为配不上任何轨迹而自然落选。闸闸的阈值在这儿有了第二种用法。'},
  metric:{t:'MOTA 把漏检、误报、ID 切换加起来算总错误率,偏重检测质量。IDF1 看每个目标的编号有多长时间保持正确,偏重身份一致。HOTA 试图把检测、关联、定位三方面平衡到一个数里。看报告时最好三个一起看。'},
  flow:{t:'光流是另一种“运动”:不认物体,直接估计每个像素从上一帧到这一帧挪了多少。经典方法有 Lucas-Kanade,深度学习方法有 RAFT。它能补充追踪:相机自己在动时,先估出相机运动并补偿掉,卡尔曼的预测才不会被带偏。'}
 },
 owl:{
  start:{t:'晚上好,我是薇拉。悠洛他们只认识训练时标注过的那几类东西。我们视觉语言模型把图像和文字放进同一个空间,所以能用一句话去找图,也能看着图回答问题。北边的板子和身后的天文台是两种做法的演示。',
    c:[['CLIP 是怎么训练的?','clip'],['“零样本分类”是什么?','zero'],['图是怎么变成 token 的?','patch'],['怎么接到语言模型上?','llm'],['VLM 能做哪些事?','tasks'],['能指出东西在哪儿吗?','ground'],['你会看错吗?','hall'],['和 YOLO 怎么分工?','vs'],['板上的数字是真的吗?','honest']]},
  clip:{t:'CLIP(2021)有两个编码器,一个读图,一个读字,各自输出一个向量。训练数据是 4 亿对网上的图片和配文。一批数据里,配对的图文向量被拉近,不配对的被推远,这叫对比学习。训练完,“一只猫的照片”这句话和猫的图片就落在空间里相近的位置。'},
  zero:{t:'于是分类不用再训练了:想分哪几类,就写哪几句话,算图片向量和每句话向量的余弦相似度,最高的就是答案。板子上就是这个过程。相似度先乘一个系数(CLIP 学到的大约是 100)再过 softmax,所以 0.30 和 0.28 这点差距会被放大成明显的概率差。',c:[['帮我换张图','zero',function(){ pV.plane.userData.tap(); }]]},
  patch:{t:'读图的编码器多半是 ViT。它把图切成固定大小的小块,比如 16×16 像素一块,每块压成一个向量,加上位置编码,就成了一串“视觉 token”,像句子里的词一样送进 Transformer,用自注意力互相交流。从板子飞向望远镜的 16 张小方片,就是这张图的 16 个图块。'},
  llm:{t:'像 LLaVA 这类能对话的 VLM 是三段拼起来的:视觉编码器把图变成一串图块特征;一个投影层把这些特征翻译到语言模型的词向量空间;语言模型把它们和你的问题拼在一起,再一个词一个词地生成回答。信箱里飞出的彩色小方块就是问题的 token。',c:[['帮我换个问题','llm',function(){ vlmNextQ(); }]]},
  tasks:{t:'描述图片、回答关于图的问题、读图里的文字和表格、比较两张图、照着界面截图写代码。因为输出是语言,同一个模型换个问法就能做不同任务,不用为每个任务单独训练一个头。这是它和检测器最大的不同。'},
  ground:{t:'可以,有两条路。一是让模型把框的坐标当成文字直接写出来。二是开放词汇检测,比如 OWL-ViT 和 Grounding DINO:你用文字说要找什么,检测器就去找,不再限于固定的类别表。常见的用法是让它们先自动标一批数据,再去训练一个又小又快的检测器。'},
  hall:{t:'会,而且是我们的老毛病。语言模型太会“顺着说”,有时会描述图里根本没有的东西,这叫幻觉。数数、左右方位、细小文字也容易错,部分原因是图块分辨率有限。缓解办法有提高输入分辨率、要求指出依据的区域、或者让检测器先给出事实,再让我来组织语言。'},
  vs:{t:'我灵活但笨重:一次回答要过一个几十亿参数的语言模型,慢,也贵。悠洛每秒能看上百帧,可以装进摄像头。所以实际系统常常分工:悠洛和追追盯着每一帧,发现值得关注的片段,再交给我用语言解释发生了什么。'},
  honest:{t:'不是真模型算的。板上的相似度是手写的,数值范围参考了 CLIP 的典型输出;问答也是预先写好的。但流程是真的:余弦相似度、乘系数、softmax、图块变 token、和文字 token 一起送进语言模型。'}
 },
 boxy:{
  start:{t:'我是框框,工地的检测机器人。这里每一组连在一起的方块,我都会画一个框,标上类别和置信度。切到右下角的“搭建”,就可以自己放方块考我。',
    c:[['框和数字是什么意思?','box'],['你是怎么认出来的?','honest'],['给我一个任务','quest'],['真的检测器怎么训练?','data']]},
  box:{t:'框叫边界框,是包住物体的最小盒子。图像里它是平面的矩形,用 4 个数表示;在这片工地上是立体的。后面的小数是置信度,“塔 0.94”表示我有 94% 的把握那是一座塔。'},
  honest:{t:'说实话,我不是神经网络。我按手写规则判断:量一下每组方块的长、宽、高和填充率,细高的叫塔,又长又薄的叫墙,中空的叫房子。规则好写,但只认得我想到过的形状。搭个奇怪的东西试试,我只能说“未知物体”。这正是人们改用数据训练检测器的原因。'},
  quest:{t:'切到“搭建”,选个颜色,点地面放方块,点方块的侧面或顶面可以接着垒。搭一座细高的塔:至少 3 层,高度是宽度的两倍以上。',c:[['我搭好了,你看看','check']]},
  check:{t:''},
  data:{t:'先要大量图片,每张都由人画好框、写好类别,比如 COCO 数据集有 80 类、十几万张标注图。训练时把网络的预测和这些标注比较,算损失,反向传播。标注又贵又慢,所以现在常让薇拉那样的大模型先自动标一遍,人只做抽查和修正。'}

  if(stop||w.pause>0){ w.pause-=dt; n.ch.walk+=(0-n.ch.walk)*Math.min(1,dt*8); return; }

function solidAt(x,z,r){ var i;
  for(i=0;i<obstacles.length;i++){ var o=obstacles[i]; if(Math.hypot(x-o.x,z-o.z)<o.r+r) return true; }
  for(i=0;i<rects.length;i++){ var q=rects[i]; if(x>q.x0-r&&x<q.x1+r&&z>q.z0-r&&z<q.z1+r) return true; }
  return false; }
function bodyHits(x,z,y){ var y0=Math.floor(y+.05), y1=Math.floor(y+1.6);
  for(var a=-1;a<=1;a+=2) for(var b=-1;b<=1;b+=2){ var fx=Math.floor(x+a*.3), fz=Math.floor(z+b*.3);
    for(var yy=y0;yy<=y1;yy++) if(blocks.has(key(fx,yy,fz))) return true; }
  return false; }
function support(x,z,y){ var best=0;
  for(var a=-1;a<=1;a+=2) for(var b=-1;b<=1;b+=2){ var fx=Math.floor(x+a*.3), fz=Math.floor(z+b*.3);
    for(var yy=Math.min(11,Math.floor(y+.05)-1);yy>=0;yy--) if(blocks.has(key(fx,yy,fz))){ if(yy+1>best) best=yy+1; break; } }
  return best; }
function indoors(x,z){ for(var i=0;i<interiors.length;i++){ var q=interiors[i]; if(x>q.x0&&x<q.x1&&z>q.z0&&z<q.z1) return true; } return false; }
function blocked(x,z){
  if(Math.hypot(x,z)>LIMIT) return true;
  if(bodyHits(x,z,PL.y)&&!bodyHits(PL.x,PL.z,PL.y)) return true;
  return solidAt(x,z,0);
}
while(bodyHits(PL.x,PL.z,PL.y)&&PL.y<12) PL.y+=1;

var ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function tap(cx,cy){
  if(dlgOpen) return;
  var r=canvas.getBoundingClientRect(); ndc.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height*2-1));
  ray.setFromCamera(ndc,camera);
  var hits=ray.intersectObjects(interactables.concat(blockMeshes,[ground]),false);
  if(!hits.length) return;
  var h=hits[0], o=h.object;
  if(o.userData.tap){ if(h.distance>60){ toast('走近一点再点'); return; } o.userData.tap(); return; }
  if(mode!=='build'){ if(o.userData.cell) toast('切到“搭建”才能改方块'); return; }
  if(h.distance>16){ toast('太远了,走近一点再放'); return; }
  var x,y,z;
  if(o.userData.cell){ var c=o.userData.cell;
    if(erasing){ userBuilt=true; removeBlock(c[0],c[1],c[2]); return; }
    var n=h.face.normal; x=c[0]+Math.round(n.x); y=c[1]+Math.round(n.y); z=c[2]+Math.round(n.z);
  } else { if(erasing) return; x=Math.floor(h.point.x); y=0; z=Math.floor(h.point.z); }
  if(y>=Math.floor(PL.y)&&y<=Math.floor(PL.y+1.7)&&Math.abs(x+.5-PL.x)<.8&&Math.abs(z+.5-PL.z)<.8){ toast('离自己太近了,退一步再放'); return; }
  if(y<4&&solidAt(x+.5,z+.5,.5)){ toast('这里有东西,换个位置'); return; }
  userBuilt=true;
  if(!addBlock(x,y,z,curColor)) toast(y>11?'已经到最高了':'这里放不了');
}

function setMode(m){ mode=m; document.body.classList.toggle('build',m==='build');
  $('mExplore').setAttribute('aria-pressed',m==='explore'); $('mBuild').setAttribute('aria-pressed',m==='build');
  if(m==='build') toast('点地面放方块,点方块的面继续垒。东边工地最宽敞'); }
$('mExplore').onclick=function(){ setMode('explore'); }; $('mBuild').onclick=function(){ setMode('build'); };
Array.prototype.forEach.call(document.querySelectorAll('.sw'),function(b){ var i=+b.dataset.c;
  b.style.background=hexCss(BCOL[i]); b.setAttribute('aria-pressed',i===curColor);
  b.onclick=function(){ curColor=i; erasing=false; $('erase').setAttribute('aria-pressed','false');
    Array.prototype.forEach.call(document.querySelectorAll('.sw'),function(o){ o.setAttribute('aria-pressed',o===b); }); }; });
$('erase').onclick=function(){ erasing=!erasing; this.setAttribute('aria-pressed',erasing); };

$('talk').onclick=function(){ if(nearNpc) openDlg(nearNpc.id); };
$('introKeys').textContent=isTouch ? '左下摇杆移动 · 拖动画面转视角 · 「跳」能跳上方块 · 轻点牌子、发光物体和居民' : 'WASD 移动 · 空格跳 · 按住鼠标拖动转视角 · 点击互动 · E 对话 · B 搭建';
function showIntro(){ closeDlg(); $('intro').classList.add('on'); }
$('go').onclick=function(){ $('intro').classList.remove('on'); canvas.focus(); };
$('helpBtn').onclick=function(){ if($('intro').classList.contains('on')) $('intro').classList.remove('on'); else showIntro(); };
if(!saved.pos) showIntro();

if(hot&&hot.snapshot) hot.snapshot(function(){ return {v:2,blocks:serialBlocks(),tasks:tasks,seen:seen,pos:[PL.x,PL.z,PL.yaw,PL.pitch,PL.y]}; });
window.__nv={PL:PL,r:renderer,n:npcList};

/* ---------- minimap ---------- */
var mctx=$('map').getContext('2d'), MZ=[['NN',0,2],['CNN',-25,-2],['工地',24,2],['YOLO',0,-28],['R-CNN',-22,-25],['追踪',26,-24],['VLM',-26,21]];
function drawMap(){
  var W=192, span=100, k=W/span;
  mctx.drawImage(gcan,w2p(-span/2),w2p(-span/2),span*mpp,span*mpp,0,0,W,W);
  mctx.fillStyle='rgba(20,22,58,.28)'; mctx.fillRect(0,0,W,W);
  mctx.font='600 15px '+FONT; mctx.textAlign='center'; mctx.textBaseline='middle'; mctx.lineWidth=3;
  MZ.forEach(function(z){ var x=(z[1]+span/2)*k, y=(z[2]+span/2)*k; mctx.strokeStyle='rgba(20,22,58,.9)'; mctx.strokeText(z[0],x,y); mctx.fillStyle='#fde725'; mctx.fillText(z[0],x,y); });
  npcList.forEach(function(n){ mctx.fillStyle=n.walker?'#ffffff':'#ff9bb0'; mctx.beginPath(); mctx.arc((n.ch.g.position.x+span/2)*k,(n.ch.g.position.z+span/2)*k,n.walker?2.5:3.5,0,7); mctx.fill(); });
  var px=(PL.x+span/2)*k, pz=(PL.z+span/2)*k;
  mctx.save(); mctx.translate(px,pz); mctx.rotate(-PL.yaw); mctx.fillStyle='#ffffff'; mctx.strokeStyle='#14163a'; mctx.lineWidth=2;
  mctx.beginPath(); mctx.moveTo(0,-11); mctx.lineTo(7,8); mctx.lineTo(0,4); mctx.lineTo(-7,8); mctx.closePath(); mctx.fill(); mctx.stroke(); mctx.restore();
}

/* ---------- loop ---------- */
var clock=new THREE.Clock(), time=0, frame=0, perfAcc=0;
function tick(){
  requestAnimationFrame(tick);
  var dt=Math.min(.05,clock.getDelta()); time+=dt; frame++;
  var mx=joy.x+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0);
  var my=joy.y+((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0);
  var ml=Math.hypot(mx,my); if(ml>1){ mx/=ml; my/=ml; }
  if(ml>.05&&!dlgOpen){
    var sp=5.6*dt, syw=Math.sin(PL.yaw), cyw=Math.cos(PL.yaw);
    var dx=(cyw*mx-syw*my)*sp, dz=(-syw*mx-cyw*my)*sp;
    if(!blocked(PL.x+dx,PL.z)) PL.x+=dx;
    if(!blocked(PL.x,PL.z+dz)) PL.z+=dz;
  }
  if(jumpQ&&PL.ground&&!dlgOpen){ PL.vy=6.7; PL.ground=false; } jumpQ=false;
  PL.vy-=19*dt; var ny=PL.y+PL.vy*dt;
  if(PL.vy>0&&bodyHits(PL.x,PL.z,ny)&&!bodyHits(PL.x,PL.z,PL.y)){ PL.vy=0; ny=PL.y; }
  var sup=support(PL.x,PL.z,PL.y);
  if(ny<=sup){ ny=sup; PL.vy=0; PL.ground=true; } else PL.ground=false;
  if(ny>.95&&indoors(PL.x,PL.z)){ ny=.95; if(PL.vy>0) PL.vy=0; }
  PL.y=ny;
  var bob=(ml>.05&&PL.ground&&!reduceMotion&&!dlgOpen)?Math.sin(time*9)*.035:0;
  camera.position.set(PL.x,PL.y+1.7+bob,PL.z); camera.rotation.set(PL.pitch,PL.yaw,0);
  for(var i=0;i<ticks.length;i++) ticks[i](time,dt);
  var best=null, bd=4.6;
  for(i=0;i<npcList.length;i++){ var n=npcList[i]; if(n.walker) tickWalker(n,dt); var d=tickNPC(n,time,dt); if(d<bd){ bd=d; best=n; } }
  if(best!==nearNpc){ nearNpc=best; var tb=$('talk'); if(best){ tb.textContent='和'+best.name.split(' ')[0]+'对话'; tb.style.display='block'; } else tb.style.display='none'; }
  if(frame%8===1) drawMap();
  if(frame<=120){ perfAcc+=dt; if(frame===120&&perfAcc/120>1/27){ renderer.setPixelRatio(1); resize(); } }
  renderer.render(scene,camera);
}
tick();
}

if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
