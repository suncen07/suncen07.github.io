<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Apps — Cen Sun</title>
  <style>
    :root {
      color-scheme: light;
      --background: #ffffff;
      --text: #202020;
      --muted: #6b6b6b;
      --line: #e6e6e6;
      --hover: #f7f7f7;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      width: min(100% - 96px, 1040px);
      min-height: 100svh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 29px 0;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .home-link {
      color: var(--muted);
      font-size: 14px;
      transition: color 180ms ease;
    }

    .home-link:hover { color: var(--text); }

    main { flex: 1; padding: 76px 0 96px; }

    h1 {
      margin: 0 0 52px;
      font-size: clamp(44px, 6vw, 70px);
      font-weight: 600;
      letter-spacing: -0.065em;
      line-height: 1.1;
    }

    .app-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 50px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .app-list li { min-width: 0; border-top: 1px solid var(--line); }

    .app-list a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 84px;
      padding: 20px 14px 20px 0;
      font-size: 17px;
      font-weight: 500;
      line-height: 1.4;
      transition: background-color 180ms ease, padding-left 180ms ease;
    }

    .app-list a::after {
      content: "↗";
      flex: none;
      color: #858585;
      font-size: 20px;
      font-weight: 400;
      transition: color 180ms ease;
    }

    .app-list a:hover,
    .app-list a:focus-visible {
      background: var(--hover);
      padding-left: 12px;
    }

    .app-list a:hover::after,
    .app-list a:focus-visible::after { color: var(--text); }

    a:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }

    @media (max-width: 700px) {
      .page { width: min(100% - 40px, 520px); }
      .topbar { padding: 23px 0; }
      main { padding: 54px 0 72px; }
      h1 { margin-bottom: 36px; }
      .app-list { grid-template-columns: 1fr; }
      .app-list a { min-height: 74px; font-size: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="https://suncen07.github.io/">Cen Sun</a>
      <a class="home-link" href="https://cs721127.github.io/">Personal Website ↗</a>
    </header>

    <main>
      <h1>Apps</h1>
      <nav aria-label="App directory">
        <ul class="app-list">
          <li><a href="app/bmi-calculator">BMI Calculator</a></li>
          <li><a href="app/score-check">Highest Score Calculator</a></li>
          <li><a href="app/p-calculator">Probability Calculator</a></li>
          <li><a href="app/xiangqi">中国象棋小游戏 (Xiang Qi Game)</a></li>
          <li><a href="writing-tool (kind of)">Simple Writing Tool</a></li>
        </ul>
      </nav>
    </main>
  </div>
</body>
</html>
