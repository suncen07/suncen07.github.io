<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fafaf8">
  <meta name="description" content="Cen Sun — personal website and apps.">
  <title>Cen Sun</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #202020;
      background: #fafaf8;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 6vw, 64px);
    }

    main {
      width: min(100%, 860px);
    }

    h1 {
      margin: 0 0 clamp(50px, 9vw, 96px);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(44px, 7vw, 76px);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 1;
    }

    nav {
      border-top: 1px solid #cdcdca;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 20px;
      justify-content: space-between;
      min-height: 132px;
      padding: 28px 12px 28px 0;
      border-bottom: 1px solid #cdcdca;
      color: inherit;
      text-decoration: none;
      transition: padding-left 180ms ease, background-color 180ms ease;
    }

    .link:hover {
      padding-left: 14px;
      background-color: #f1f1ee;
    }

    .link:focus-visible {
      outline: 2px solid #222;
      outline-offset: 4px;
    }

    .link-title {
      display: block;
      margin-bottom: 10px;
      font-size: clamp(23px, 3.4vw, 34px);
      font-weight: 450;
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .link-url {
      display: block;
      color: #676763;
      font-size: 14px;
      letter-spacing: 0.005em;
      overflow-wrap: anywhere;
    }

    .arrow {
      flex: none;
      width: 28px;
      height: 28px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 560px) {
      body { align-items: flex-start; padding: 76px 24px 48px; }
      h1 { margin-bottom: 64px; }
      .link { min-height: 112px; padding-block: 24px; }
      .link-title { margin-bottom: 8px; }
      .arrow { width: 24px; height: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Cen Sun</h1>
    <nav aria-label="Main navigation">
      <a class="link" href="https://cs721127.github.io/">
        <span>
          <span class="link-title">Personal Website</span>
          <span class="link-url">cs721127.github.io</span>
        </span>
        <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M5 19 19 5M7 5h12v12" />
        </svg>
      </a>
      <a class="link" href="https://suncen07.github.io/app">
        <span>
          <span class="link-title">Apps</span>
          <span class="link-url">suncen07.github.io/app</span>
        </span>
        <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24">
          <path d="M5 19 19 5M7 5h12v12" />
        </svg>
      </a>
    </nav>
  </main>
</body>
</html>
