step-list p{font-size:15px;line-height:1.9}.tip-list{list-style:none;display:grid;gap:12px;padding:0;margin:22px 0 0}.tip-list li{display:flex;gap:12px;align-items:flex-start;padding:15px 18px;border-radius:12px;background:var(--sage);font-size:14px;color:var(--forest);line-height:1.85}.tip-list .icon{width:19px;height:19px;margin-top:3px;color:var(--forest-mid)}.guide-side{min-width:0}.guide-side-inner{position:sticky;top:22px}.info-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:23px;margin-bottom:17px;box-shadow:var(--shadow-sm)}.info-card h3{font-size:19px;letter-spacing:-.03em;margin-bottom:18px}.map-frame{width:100%;height:215px;display:block;border:0;background:var(--sage);border-radius:14px;margin-bottom:17px}.route-nodes{display:grid;gap:12px;margin-bottom:19px}.route-node{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:var(--forest-mid);font-weight:700}.route-node .dot{width:11px;height:11px;border:3px solid var(--forest-mid);border-radius:50%;flex:none;margin-top:6px}.route-node:last-child .dot{background:var(--coral);border-color:var(--coral)}.guide-info-row{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.guide-info-row .icon{color:var(--coral-hover);margin-top:3px}.guide-info-row b{font-size:13px}.guide-info-row p{font-size:13px;line-height:1.7;margin-top:3px}.caution{font-size:12px;line-height:1.9;color:var(--muted);padding:0 4px}.again-banner{background:var(--sage);border-radius:22px;padding:32px 38px;display:flex;justify-content:space-between;align-items:center;gap:25px}.again-banner h2{font-size:27px;letter-spacing:-.03em;margin:5px 0}.again-banner p{font-size:14px}

   <section class="guide-block"><span class="eyebrow">游玩路线</span><h2>可以这样逛</h2><p></p><ol class="step-list">${d.steps.map((s,i)=>`<li><span class="step-no">${String(i+1).padStart(2,'0')}</span><div><h3>${s[1]}</h3><p>${s[2]}</p></div></li>`).join('')}</ol></section>
   <section class="guide-block"><span class="eyebrow">出发提醒</span><h2>出发前须知</h2><ul class="tip-list">${d.tips.map(t=>`<li>${icons('check')}<span>${t}</span></li>`).join('')}</ul></section>
   <section class="guide-block"><span class="eyebrow">附近补给</span><h2>吃点什么</h2><p>${d.eat}</p></section></article>
   <aside class="guide-side" aria-label="路线和出发信息"><div class="guide-side-inner"><section class="info-card"><h3>目的地与路线</h3><iframe class="map-frame" title="${d.english} 地点地图预览" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=${encodeURIComponent(d.endAddress)}&output=embed"></iframe>
    <div class="route-nodes"><div class="route-node"><span class="dot"></span><span>${d.start}</span></div><div class="route-node"><span class="dot"></span><span>${d.end}</span></div></div>
    <a class="btn btn--coral btn--full" href="${routeLink(d)}" target="_blank" rel="noopener noreferrer">${icons('location')} 用 Google Maps 导航 ${icons('arrow-up')}</a><a class="inline-link" style="margin-top:14px" href="${locationLink(d)}" target="_blank" rel="noopener noreferrer">单独查看目的地 ${icons('arrow-up')}</a></section>
   <section class="info-card"><h3>出发速览</h3><div class="guide-info-row">${icons('ferry')}<div><b>交通建议</b><p>${d.go}</p></div></div><div class="guide-info-row">${icons('clock')}<div><b>步行参考</b><p>${d.walk} · ${d.difficulty}</p></div></div><div class="guide-info-row">${icons('ticket')}<div><b>费用</b><p>${d.cost}</p></div></div><div class="guide-info-row">${icons('sun')}<div><b>推荐时间</b><p>${d.best}</p></div></div><a class="inline-link" style="margin-top:9px" href="https://transportnsw.info/trip" target="_blank" rel="noopener noreferrer">查看 Transport NSW 实时交通 ${icons('arrow-up')}</a></section>
   <p class="caution">地图展示目的地位置，不代表精准步行路线。出行前请自行核实交通、开放时间、天气与现场安全信息；海边活动不构成游泳安全建议。</p></div></aside></div>
   <div class="again-banner"><div><span class="eyebrow"></span><h2>再换一个地方</h2><p></p></div>${action(`${icons('refresh')} 再随机一个`,'random','btn--forest')}</div>
 </main>${footer()}${bottom('home')}</div>`;}
function savedCard(d){return `<article class="saved-card"><div class="saved-photo"><a href="#detail/${d.id}" aria-label="查看 ${d.english} 详细攻略">${pic(d.photo,'',labelPhoto(d),'loading="lazy"')}</a>${heart(d.id,'saved-heart')}</div><div class="saved-card-body"><span class="eyebrow">${d.endAddress}</span><h2>${d.english}</h2><p>${d.desc}</p><div class="saved-card-actions"><span>${icons('clock')} ${d.time}</span><a class="inline-link" href="#detail/${d.id}">查看攻略 ${icons('arrow')}</a></div></div></article>`;}
function saved(){const list=favorites.map(getDest);return `<div class="page page--favorites">${head('favorites')}<main id="main-content" tabindex="-1" class="container submain"><span class="eyebrow page-kicker">收藏</span><h1 class="page-title">好地方，<br><em>慢慢收藏。</em></h1><p class="page-lead">把心动的地点放在这里。下一次想出门，不必重新找。</p>${list.length?`<p style="font-size:14px;color:var(--muted)">共 ${list.length} 个收藏 · 仅保存在当前浏览器</p><div class="saved-grid">${list.map(savedCard).join('')}</div>`:`<section class="empty-state"> <div class="empty-icon">${icons('heart')}</div><h2>还没有收藏的地方。</h2><p>看到喜欢的地点，点一下爱心。下次想出发，就能从这里接着走。</p>${action(`${icons('sparkle')} 带我发现一个地方`,'random','btn--coral')}</section>`}</main>${footer()}${bottom('favorites')}</div>`;}
function about(){return `<div class="page page--about">${head('about')}<main id="main-content" tabindex="-1" class="container submain"><span class="eyebrow page-kicker">关于</span><h1 class="page-title">不是去哪里。<br><em>是先走出去。</em></h1><p class="page-lead">Somewhere 是关于少一点纠结、多一点体验的悉尼小小提议。</p>
 <section class="about-split"><div class="about-photo">${pic('coast','', '悉尼海岸线的实景摄影照片', 'loading="lazy"')}</div><div class="about-text"><span class="eyebrow">为什么做 Somewhere</span><h2>真正有趣的日子，<br>不一定要计划周全。</h2><p>有时候，我们只是突然想出去走走，却花了半个小时在地图上挑选目的地。</p><p>所以 Somewhere 只做一件事：给你一个值得探索的地方，并把怎么玩、怎么去的初步信息整理好。</p><p>剩下的，就穿上鞋，出门。</p>${action(`${icons('sparkle')} 现在出发`,'random','btn--coral')}</div></section>
 <div class="about-disclaimer"><strong>关于这个演示：</strong>当前是独立的前端概念 Demo，精选地点仅用于演示。随机选择、偏好筛选、收藏和分享可使用；地图嵌入与图片需要联网，不提供登录、实时路线估算或场所实时营业验证。收藏与偏好仅保存在当前浏览器。</div>
 </main>${footer()}${bottom('about')}</div>`;}
function paint({shiftFocus=false}={}){
 const {page,id}=current();const d=getDest(id);
 app.innerHTML=page==='home'?home():page==='result'?result(d):page==='detail'?detail(d):page==='favorites'?saved():about();
 document.title=page==='home'?'Somewhere — 想出去走走？哪里都行。':`${page==='favorites'?'我的收藏':page==='about'?'关于 Somewhere':d.english+' · '+(page==='result'?'随机发现':'完整攻略')} | Somewhere Sydney`;
 window.scrollTo({top:0,behavior:'instant'});
 if(shiftFocus){const m=document.querySelector('#main-content');if(m)m.focus({preventScroll:true});}
}
function go(page,id=''){const h='#'+page+(id?'/'+id:'');if(location.hash===h)paint({shiftFocus:true});else location.hash=h;}
function eligible(){return DESTINATIONS.filter(d=>{
 if(excluded.includes(d.id))return false;
 if(preferences.source==='favorites'&&!favorites.includes(d.id))return false;
 if(preferences.source==='new'&&history.includes(d.id))return false;
 const vibe=preferences.vibe==='all'||(preferences.vibe==='coast'?d.id!=='garden':d.id==='garden');
 const duration=preferences.duration==='all'||(preferences.duration==='short'?d.id==='garden':d.id!=='garden');
 return vibe&&duration;
});}
function pickRandom(){
 if(randomBusy)return;
 const pool=eligible();
 if(!pool.length){showToast(preferences.source==='favorites'&&!favorites.length?'先收藏几个地点，再从收藏抽选':'没有符合条件的目的地，请调整偏好或排除列表');openModal('prefs');return;}
 const q=dailyQuota();
 if(q.draws>0&&q.switches>=MAX_SWITCHES){openModal('usage');return;}
 const alternatives=pool.filter(d=>d.id!==lastPicked);const candidates=alternatives.length?alternatives:pool;
 const d=candidates[Math.floor(Math.random()*candidates.length)];lastPicked=d.id;
 history=[d.id,...history.filter(x=>x!==d.id)].slice(0,12);saveStore(STORE_HISTORY,history);
 q.draws++;if(q.draws>1)q.switches++;saveStore(STORE_QUOTA,q);
 randomBusy=true;
 const pressed=document.querySelector('[data-action="random"]');if(pressed){pressed.disabled=true;pressed.setAttribute('aria-busy','true');}
 setTimeout(()=>{randomBusy=false;go('result',d.id);},window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:150);
}
function toggleFavorite(id){const was=favorites.includes(id);favorites=was?favorites.filter(x=>x!==id):[id,...favorites];saveStore(STORE_FAV,favorites);const y=window.scrollY;
 const btn=document.querySelector(`[data-action="favorite"][data-id="${id}"]`); const focus=btn===document.activeElement;
 const page=current().page;app.innerHTML=page==='home'?home():page==='result'?result(getDest(current().id)):page==='detail'?detail(getDest(current().id)):page==='favorites'?saved():about();
 window.scrollTo({top:Math.max(0,Math.min(y,document.documentElement.scrollHeight-innerHeight)),behavior:'instant'}); if(focus)document.querySelector(`[data-action="favorite"][data-id="${id}"]`)?.focus({preventScroll:true});showToast(was?'已移出收藏':'已收藏，下次从这里继续出发');}
function showToast(t){toastNode.textContent=t;toastNode.classList.add('is-visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastNode.classList.remove('is-visible'),3000);}
function modalWrap(content){const root=document.querySelector('#modal-root');root.innerHTML=`<div class="dialog-screen" data-action="close-modal"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" data-dialog-content><div class="dialog-header"><span class="dialog-mark">Somewhere</span><button type="button" class="round-btn" data-action="close-modal" aria-label="关闭弹窗">${icons('close')}</button></div>${content}</section></div>`;
 document.body.classList.add('is-locked');root.querySelector('#dialog-title')?.setAttribute('tabindex','-1');root.querySelector('#dialog-title')?.focus({preventScroll:true});}
function panelBack(){return `<button type="button" class="back-action" data-action="open-panel" data-panel="account">${icons('arrow-left')} 返回设置</button>`;}
function settingsRow(icon,title,description,act,extra=''){return `<button type="button" class="settings-row" data-action="${act}" ${extra}><span class="settings-symbol">${icons(icon)}</span><span class="settings-copy"><strong>${title}</strong>${description?`<small>${description}</small>`:''}</span>${icons('chevron')}</button>`;}
function chips(name,items,val){const legends={source:'抽取范围',vibe:'目的地类型',duration:'可用时间'};return `<fieldset><legend>${legends[name]||name}</legend><div class="chip-row">${items.map(([id,label])=>`<button type="button" class="chip" data-action="pref-chip" data-pref="${name}" data-value="${id}" aria-pressed="${id===val}">${label}</button>`).join('')}</div></fieldset>`;}
function openModal(kind){
 if(!modalKind)modalFocusOrigin=document.activeElement;
 modalKind=kind;
 if(kind==='prefs'){pendingPrefs={...preferences};renderPrefs();return;}
 if(kind==='account'){
  modalWrap(`<h2 id="dialog-title">我的 Somewhere</h2><div class="account-summary"><div><small>我的收藏</small><strong>${favorites.length}</strong></div><div><small>今日换选</small><strong>${dailyQuota().switches}<span> / ${MAX_SWITCHES}</span></strong></div><div><small>不再推荐</small><strong>${excluded.length}</strong></div></div>
  <div class="settings-list">${settingsRow('heart','收藏列表',`${favorites.length} 个已收藏地点`,'modal-favorites')}${settingsRow('compass','抽取偏好',preferences.source==='favorites'?'当前：从收藏中抽取':'地点范围、类型、时间','open-panel','data-panel="prefs"')}${settingsRow('close','不再推荐',`${excluded.length} 个地点已排除`,'open-panel','data-panel="exclusions"')}${settingsRow('refresh','换选次数',quotaStatusText(),'open-panel','data-panel="usage"')}${settingsRow('menu','语言与本地数据','语言、清理缓存','open-panel','data-panel="settings"')}</div><p class="modal-note">设置仅保存在当前浏览器。</p>`);return;
 }
 if(kind==='exclusions'){modalWrap(`${panelBack()}<h2 id="dialog-title">不再推荐</h2><p class="dialog-hint">选中的地点不会出现在随机结果中。</p><div class="exclude-list">${DESTINATIONS.map(d=>`<button type="button" class="exclude-row" data-action="toggle-exclusion" data-id="${d.id}" aria-pressed="${excluded.includes(d.id)}"><span><b>${d.english}</b><small>${d.endAddress}</small></span><span class="exclude-status">${excluded.includes(d.id)?'已排除':'允许推荐'}</span></button>`).join('')}</div><div class="dialog-footer"><button type="button" class="btn btn--pale btn--full" data-action="clear-exclusions">恢复全部推荐</button></div>`);return;}
 if(kind==='usage'){const q=dailyQuota();modalWrap(`${panelBack()}<h2 id="dialog-title">今日换选次数</h2><div class="usage-large"><strong>${Math.max(0,MAX_SWITCHES-q.switches)}</strong><span>次可用换选</span></div><div class="usage-segments">${Array.from({length:MAX_SWITCHES},(_,i)=>`<span class="${i<q.switches?'used':''}"></span>`).join('')}</div><p class="dialog-hint">每天首次抽取免费，之后最多换选 ${MAX_SWITCHES} 次。按悉尼日期重置；调整筛选或清理本地数据不会恢复额度。</p>`);return;}
 if(kind==='settings'){modalWrap(`${panelBack()}<h2 id="dialog-title">语言与本地数据</h2><div class="setting-block"><label class="setting-label" for="language-picker">语言</label><select id="language-picker" class="setting-select" aria-describedby="lang-note"><option>简体中文</option><option disabled>English（即将支持）</option><option disabled>繁體中文（即将支持）</option></select><p class="modal-note" id="lang-note">其他语言将在正式版本中提供。</p></div><div class="setting-block"><h3>本地缓存</h3><p>可清除收藏、历史记录、抽取偏好和排除列表。当天换选额度会保留。</p><button class="btn btn--outline" type="button" data-action="open-panel" data-panel="confirm-clear">清理本地数据</button></div>`);return;}
 if(kind==='confirm-clear'){modalWrap(`${panelBack()}<h2 id="dialog-title">清理本地数据？</h2><p>收藏、历史记录、抽取偏好和不再推荐列表会从本浏览器删除。今日换选次数不会恢复。</p><div class="dialog-footer"><button class="btn btn--pale" type="button" data-action="open-panel" data-panel="settings">取消</button><button class="btn btn--forest" type="button" data-action="clear-local-data">确认清理</button></div>`);return;}
 modalWrap(`<h2 id="dialog-title">摄影来源</h2><p>页面使用 Wikimedia Commons 摄影素材。请在原始页面查看作者及许可，图片与地图需要联网。</p><div class="credits-list">
 <a target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/File:Sydney_Harbour_Bridge_and_Sydney_Opera_House_panorama.jpg">Sydney Harbour panorama ↗</a>
 <a target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/File:Looking_over_Shelly_Beach_and_Cabbage_Tree_Bay_in_Sydney.jpg">Shelly Beach / Cabbage Tree Bay ↗</a>
 <a target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/File:Shelly_Beach_in_Manly_Sydney_Australia.jpg">Shelly Beach ↗</a>
 <a target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/File:Wendys_Secret_Garden_MRD_01.jpg">Wendy's Secret Garden ↗</a>
 <a target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/File:Sydney_(AU),_Bondi_To_Bronte_Coastal_Walk_--_2019_--_2358.jpg">Bondi to Bronte ↗</a>
 <a target="_blank" rel="noopener noreferrer" href="https://commons.wikimedia.org/wiki/File:HornbyLighthouse.jpg">Hornby Lighthouse ↗</a></div>`);
}
function renderPrefs(){const content=`${panelBack()}<h2 id="dialog-title">抽取偏好</h2><p class="dialog-hint">不设置条件，就从全部可推荐地点中随机选择。</p>
 <div class="dialog-options">${chips('source',[['all','全部地点'],['favorites','我的收藏'],['new','尚未抽中过']],pendingPrefs.source)}${chips('vibe',[['all','不限'],['coast','海边 / 海岸'],['nature','花园 / 安静地点']],pendingPrefs.vibe)}${chips('duration',[['all','不限'],['short','1–2 小时'],['half','半日或更久']],pendingPrefs.duration)}</div>
 <details class="advanced-details"><summary>更多高级筛选 <span>演示占位</span></summary><div class="placeholder-grid"><label>出发地点<select disabled><option>定位或选择起点（即将支持）</option></select></label><label>交通方式<select disabled><option>公共交通 / 步行 / 驾车（即将支持）</option></select></label><label>预算<select disabled><option>不限 / 免费 / 预算范围（即将支持）</option></select></label><label>探索区域<select disabled><option>悉尼区域筛选（即将支持）</option></select></label></div></details>
 <p class="modal-note">可从收藏中随机选取；已设为“不再推荐”的地点始终排除。当前仅有 ${DESTINATIONS.length} 个演示地点。</p>
 <div class="dialog-footer"><button type="button" data-action="reset-prefs" class="btn btn--pale">恢复默认</button><button type="button" data-action="save-prefs" class="btn btn--coral">保存偏好 ${icons('check')}</button></div>`;
 modalWrap(content);}
function closeModal(restore=true){document.querySelector('#modal-root').innerHTML='';document.body.classList.remove('is-locked');modalKind=null;pendingPrefs=null;if(restore&&modalFocusOrigin?.isConnected)modalFocusOrigin.focus({preventScroll:true});modalFocusOrigin=null;}
async function share(id){const d=getDest(id);const url=location.href.split('#')[0]+'#detail/'+d.id;
 try{if(navigator.share){await navigator.share({title:d.title,text:`Somewhere 带我发现了 ${d.title}`,url});return;}
 if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);showToast('已复制攻略链接');return;}
 const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();showToast(ok?'已复制攻略链接':'请复制地址栏中的攻略链接');}
 catch(e){if(e.name!=='AbortError')showToast('无法自动复制，请使用浏览器地址栏分享');}}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;
 const a=target.dataset.action;if(a==='close-modal'&&event.target.closest('[data-dialog-content]')&&!event.target.closest('button'))return;
 event.preventDefault();
 if(a==='scroll-inspiration')document.querySelector('#inspiration')?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
 else if(a==='random')pickRandom();else if(a==='favorite')toggleFavorite(target.dataset.id);else if(a==='commit')go('detail',target.dataset.id);
 else if(['prefs','account','credits'].includes(a))openModal(a);else if(a==='open-panel')openModal(target.dataset.panel);else if(a==='close-modal')closeModal();
 else if(a==='modal-favorites'){closeModal(false);go('favorites');}
 else if(a==='share')share(target.dataset.id);
 else if(a==='toggle-exclusion'){const id=target.dataset.id;excluded=excluded.includes(id)?excluded.filter(x=>x!==id):[...excluded,id];saveStore(STORE_BLOCKED,excluded);openModal('exclusions');document.querySelector(`[data-action="toggle-exclusion"][data-id="${id}"]`)?.focus({preventScroll:true});}
 else if(a==='clear-exclusions'){excluded=[];saveStore(STORE_BLOCKED,excluded);openModal('exclusions');showToast('已恢复所有地点的推荐');}
 else if(a==='clear-local-data'){favorites=[];history=[];excluded=[];lastPicked='';preferences={source:'all',vibe:'all',duration:'all'};[STORE_FAV,STORE_HISTORY,STORE_PREF,STORE_BLOCKED].forEach(k=>{try{localStorage.removeItem(k);}catch{}});closeModal(false);paint();showToast('已清理本地数据，今日额度保持不变');}
 else if(a==='pref-chip'&&pendingPrefs){pendingPrefs[target.dataset.pref]=target.dataset.value;document.querySelectorAll(`[data-pref="${target.dataset.pref}"]`).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===target.dataset.value)));}
 else if(a==='reset-prefs'&&pendingPrefs){pendingPrefs={source:'all',vibe:'all',duration:'all'};document.querySelectorAll('[data-pref]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value==='all')));}
 else if(a==='save-prefs'&&pendingPrefs){preferences={...pendingPrefs};saveStore(STORE_PREF,preferences);closeModal();if(current().page==='home')paint();showToast('已保存，下次随机会使用这些偏好');}
});
document.addEventListener('keydown',event=>{if(!modalKind)return;
 if(event.key==='Escape'){event.preventDefault();closeModal();return;}
 if(event.key==='Tab'){const box=document.querySelector('[role="dialog"]');if(!box)return;const focusables=[...box.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(n=>n.getClientRects().length);
 if(!focusables.length)return;const first=focusables[0],last=focusables.at(-1);
 if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
});
document.addEventListener('error',event=>{const img=event.target;if(!(img instanceof HTMLImageElement))return;const stage=Number(img.dataset.stage||'0');
 if(stage===0){img.dataset.stage='1';img.src=img.src.replace('https://thumb.wikimedia.org/','https://upload.wikimedia.org/');return;}
 if(stage===1&&img.dataset.photo!=='harbour'){img.dataset.stage='2';img.src=PHOTO.harbour;return;}
 img.style.display='none';const p=img.parentElement;if(p)p.classList.add('image-unavailable');
},true);
window.addEventListener('hashchange',()=>paint({shiftFocus:true}));
paint();

</script></body></html>
